name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: make typecheck

      - name: Test (vitest + python unittest)
        run: make test

      - name: Build
        run: make build
        env:
          # The app never runs inference during `next build`; mock mode keeps the
          # build self-contained if any route exercises the bridge at import time.
          STABLE_AUDIO_MOCK: "1"
